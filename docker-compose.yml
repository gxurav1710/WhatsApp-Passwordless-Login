services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-whatsapp_auth}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-whatsapp_auth}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:4000}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-whatsapp_auth}?schema=public
      WORKER_URL: http://whatsapp-worker:4001
      WORKER_INTERNAL_SECRET: ${WORKER_INTERNAL_SECRET:-worker_secret_key_change_me_in_prod_abcde}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin_super_secret_key_change_me_in_prod_12345}
      SESSION_SECRET: ${SESSION_SECRET:-session_secret_key_change_me_in_prod_67890}
      WHATSAPP_BOT_PHONE: ${WHATSAPP_BOT_PHONE:-+14155550199}
    depends_on:
      postgres:
        condition: service_healthy

  whatsapp-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-4001}:4001"
    environment:
      NODE_ENV: production
      WORKER_PORT: 4001
      AUTH_API_URL: http://auth-api:4000
      WORKER_INTERNAL_SECRET: ${WORKER_INTERNAL_SECRET:-worker_secret_key_change_me_in_prod_abcde}
      WHATSAPP_ADAPTER: ${WHATSAPP_ADAPTER:-baileys}
      WHATSAPP_SESSION_PATH: /app/apps/whatsapp-worker/.baileys_auth
    volumes:
      - baileys_auth:/app/apps/whatsapp-worker/.baileys_auth
    depends_on:
      - auth-api

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - auth-api

volumes:
  pgdata:
    driver: local
  baileys_auth:
    driver: local
